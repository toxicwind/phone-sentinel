[tools]
bun = "1.4.3-canary.1"
node = "22"

[env]
ADB_BIN = "/opt/android-sdk/platform-tools/adb"
PIXEL_LAN_IP = "10.0.0.77"
PIXEL_TAILSCALE_IP = "100.123.57.58"
PORT_SENTINEL_METRICS = "25178"

[tasks.start]
run = "bun run src/index.ts"
description = "Start the Phone Sentinel reactive supervisor"

[tasks.status]
run = "bun run src/status.ts"
description = "Query current phone connectivity status"
